version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [three, '@types/three']
    ignore:
      # Majors of the rendering/tooling stack are deliberate upgrades (see docs/AUTOMATION.md).
      - { dependency-name: react, update-types: ['version-update:semver-major'] }
      - { dependency-name: react-dom, update-types: ['version-update:semver-major'] }
      - { dependency-name: '@react-three/fiber', update-types: ['version-update:semver-major'] }
      - { dependency-name: '@react-three/drei', update-types: ['version-update:semver-major'] }
      - { dependency-name: vite, update-types: ['version-update:semver-major'] }
      - { dependency-name: '@vitejs/plugin-react', update-types: ['version-update:semver-major'] }
      - { dependency-name: vitest, update-types: ['version-update:semver-major'] }
      - { dependency-name: typescript, update-types: ['version-update:semver-major'] }
      - { dependency-name: eslint, update-types: ['version-update:semver-major'] }
      # three.js 0.x minors can be breaking: patch updates only; bump minors by hand with the R3F/drei peer ranges in mind.
      - { dependency-name: three, update-types: ['version-update:semver-minor', 'version-update:semver-major'] }
      - { dependency-name: '@types/three', update-types: ['version-update:semver-minor', 'version-update:semver-major'] }
