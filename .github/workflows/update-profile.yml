name: Update profile

on:
  schedule:
    - cron: '23 1,9,17 * * *' # three times a day, off the top of the hour; scheduled runs may be delayed
  workflow_dispatch:

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'itssourov13'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # only needed to push the generated files
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect GitHub data and regenerate
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate generated output
        run: npm run check
      - name: Commit only if something changed
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "chore(profile): refresh generated profile data"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-world.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
